<head>
<meta charset="utf-8">

<style>
:root{--bg:#0e0b1f;--bg2:#17122e;--card:#211a40;--txt:#f3f0ff;--mut:#9d94c7;--acc:#2ee86f;--acc2:#ffcc1a;--hot:#ff3d7f;--line:#2e2657}
body.light{--bg:#f4f2ff;--bg2:#fff;--card:#fff;--txt:#1d1640;--mut:#6b6492;--line:#e0dcf5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Nunito,sans-serif;min-height:100vh}
h1,h2,.logo,.btn,.chip{font-family:'Lilita One',cursive;letter-spacing:.5px}
a{color:inherit;text-decoration:none}
/* START */
#gate{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(circle at 50% 40%,#2a1d63,#07050f)}
#gate h1{font-size:clamp(40px,8vw,90px);background:linear-gradient(90deg,var(--acc),var(--acc2),var(--hot));-webkit-background-clip:text;color:transparent}
#startBtn{font-family:'Lilita One';font-size:42px;padding:20px 70px;border:0;border-radius:99px;background:var(--acc);color:#05230f;cursor:pointer;box-shadow:0 0 0 0 #2ee86f99;animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 30px #2ee86f00}100%{box-shadow:0 0 0 0 #2ee86f00}}
/* layout */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:2px solid var(--line)}
.logo{font-size:26px;white-space:nowrap;cursor:pointer}.logo b{color:var(--acc)}
#q{flex:1;max-width:520px;padding:11px 18px;border-radius:99px;border:2px solid var(--line);background:var(--bg);color:var(--txt);font:inherit;font-size:15px}
#q:focus{outline:none;border-color:var(--acc)}
.ib{border:0;background:var(--card);color:var(--txt);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:19px;flex-shrink:0}
.ib:hover{background:var(--acc);color:#05230f}
.wrap{display:flex}
nav{width:200px;flex-shrink:0;padding:14px 10px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.chip{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;margin-bottom:4px;border:0;border-radius:12px;background:none;color:var(--txt);font-size:17px;cursor:pointer;text-align:left}
.chip:hover{background:var(--card)}.chip.on{background:var(--acc);color:#05230f}
.chip small{margin-left:auto;font-family:Nunito;font-size:12px;opacity:.7}
main{flex:1;padding:16px;min-width:0}
.hero{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:22px}
.hero .g{aspect-ratio:auto;height:100%}.hero .g:first-child{grid-row:span 2;min-height:300px}
h2{font-size:24px;margin:20px 0 10px;display:flex;align-items:center;gap:10px}
h2 span{font-family:Nunito;font-size:13px;color:var(--mut)}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.row .g{width:170px;flex-shrink:0;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sz,160px),1fr));gap:12px}
.g{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--card);transition:transform .15s,box-shadow .15s}
.g:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 10px 30px #0007,0 0 0 3px var(--acc);z-index:2}
.g img{width:100%;height:100%;object-fit:cover;display:block}
.g .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:44px;color:#fff;text-shadow:0 3px 0 #0005}
.g .nm{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(transparent,#000c);opacity:0;transition:.15s}
.g:hover .nm,.hero .g .nm,.side .g .nm{opacity:1}
.tag{position:absolute;top:7px;left:7px;font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--hot);color:#fff}
.tag.own{background:var(--acc2);color:#2b1d00}
.fav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:#0008;color:#fff;cursor:pointer;opacity:0;font-size:15px}
.g:hover .fav,.fav.on{opacity:1}.fav.on{color:var(--hot)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select{padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--txt);font:inherit}
.empty{padding:60px;text-align:center;color:var(--mut);font-size:18px}
/* player */
#player{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
#player.on{display:flex}
.ptop{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:2px solid var(--line)}
.ptop h3{font-family:'Lilita One';font-size:22px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;border-radius:12px;padding:9px 16px;font-size:16px;cursor:pointer;background:var(--card);color:var(--txt)}
.btn.lk.on{background:var(--acc);color:#05230f}.btn.dl.on{background:var(--hot);color:#fff}
.pbody{flex:1;display:flex;min-height:0}
#frame{flex:1;border:0;background:#000}
.side{width:230px;overflow:auto;padding:10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.side .g{aspect-ratio:16/10}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--acc);color:#05230f;padding:12px 22px;border-radius:99px;font-weight:800;z-index:100;transition:.3s}
#toast.on{transform:translateX(-50%)}
.stat{color:var(--mut);font-size:13px}
@media(max-width:820px){nav{display:none}nav.open{display:block;position:fixed;left:0;background:var(--bg2);z-index:30}.hero{grid-template-columns:1fr 1fr}.hero .g:first-child{grid-column:span 2;grid-row:auto;min-height:200px}.side{display:none}.logo span{display:none}}
#aiBox{background:linear-gradient(135deg,#2a1d63,#3b1450);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:22px}
#aiBox h2{margin:0 0 8px}#aiRow{display:flex;gap:8px;flex-wrap:wrap}#aiQ{flex:1;min-width:200px;padding:12px 16px;border-radius:99px;border:2px solid var(--line);background:var(--bg);color:var(--txt);font:inherit}
#aiGo{border:0;border-radius:99px;padding:12px 22px;background:var(--acc);color:#05230f;font-family:'Lilita One';font-size:17px;cursor:pointer}#aiMsg{margin:10px 0;color:var(--mut)}
</style>

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function card(g){
  const im=g.i?`<img loading="lazy" src="${g.i}" alt="" onerror="this.outerHTML=ph('${g.id}')">`:ph(g.id);
  const lk=stats[g.id]?.likes||0;
  return `<div class="g" data-id="${g.id}">${im}${g.o?'<span class="tag own">SİGMA</span>':(lk>=5?'<span class="tag">🔥 HOT</span>':'')}<button class="fav ${favs.includes(g.id)?'on':''}" data-fav="${g.id}">${favs.includes(g.id)?'♥':'♡'}</button><div class="nm">${g.t}</div></div>`}
function ph(id){const g=byId[id],h=hue(id);return `<div class="ph" style="background:linear-gradient(135deg,hsl(${h},75%,55%),hsl(${(h+60)%360},80%,35%))">${g.t.split(' ').map(w=>w[0]).join('').slice(0,3)}</div>`}
function score(g){const s=stats[g.id]||{};return (s.likes||0)*3-(s.dislikes||0)+(plays[g.id]||0)}
function list(c){
  if(c==='all')return GAMES;
  if(c==='fav')return favs.map(i=>byId[i]).filter(Boolean);
  if(c==='recent')return recent.map(i=>byId[i]).filter(Boolean);
  if(c==='top')return [...GAMES].sort((a,b)=>score(b)-score(a)).slice(0,60);
  if(c==='new')return [...GAMES].reverse().slice(0,40);
  return GAMES.filter(g=>g.c===c)}
function renderNav(){Q('#nav').innerHTML=CATS.map(([k,e,n])=>{const cnt=['home','top','new'].includes(k)?'':list(k).length;return `<button class="chip ${cur===k?'on':''}" data-cat="${k}">${e} ${n}<small>${cnt}</small></button>`}).join('')}
function row(title,arr,cat){if(!arr.length)return'';return `<h2>${title} <span>${arr.length} oyun</span>${cat?`<button class="btn" style="margin-left:auto;font-size:13px" data-cat="${cat}">Hepsi →</button>`:''}</h2><div class="row">${arr.slice(0,20).map(card).join('')}</div>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function goCat(c){cur=c;Q('#q').value='';renderNav();render();Q('#nav').classList.remove('open');scrollTo(0,0)}
function render(){
  const q=Q('#q').value.trim().toLowerCase();const m=Q('#main');
  if(q){const r=GAMES.filter(g=>g.t.toLowerCase().includes(q)||g.id.includes(q)||g.c.toLowerCase().includes(q));
    m.innerHTML=`<h2>🔍 "${q}" <span>${r.length} sonuç</span></h2>`+(r.length?`<div class="grid">${r.map(card).join('')}</div>`:`<div class="empty">Bulunamadı 😢<br><br><button class="btn" onclick="playRandom()">🎲 Rastgele bir oyun aç</button></div>`);return}
  if(cur==='home'){const f=shuffle(GAMES.filter(g=>g.i)).slice(0,5);
    m.innerHTML=aiHTML()+`<div class="hero">${f.map(card).join('')}</div>`+(recent.length?row('🕘 Kaldığın Yerden Devam',list('recent'),'recent'):'')+row('⭐ Sigma Özel Oyunları',list('Sigma Özel'),'Sigma Özel')+(favs.length?row('❤️ Favorilerin',list('fav'),'fav'):'')+row('🔥 En Beğenilenler',list('top'),'top')+['Aksiyon','Yarış','Spor','.io','2 Oyunculu','Bulmaca','Platform'].map(c=>row(CATS.find(x=>x[0]===c)[1]+' '+c,shuffle(list(c)),c)).join('')+row('🎉 Daha Fazla Eğlence',shuffle(list('Eğlence')),'Eğlence');return}
  let arr=list(cur);const so=LS.g('sort','def');
  if(so==='az')arr=[...arr].sort((a,b)=>a.t.localeCompare(b.t,'tr'));if(so==='pop')arr=[...arr].sort((a,b)=>score(b)-score(a));
  const n=CATS.find(x=>x[0]===cur);
  m.innerHTML=`<h2>${n[1]} ${n[2]} <span>${arr.length} oyun</span></h2><div class="bar"><select id="sort"><option value="def">Varsayılan</option><option value="pop">En popüler</option><option value="az">A → Z</option></select><select id="size"><option value="130px">Küçük</option><option value="160px">Orta</option><option value="220px">Büyük</option></select></div>`+(arr.length?`<div class="grid" style="--sz:${LS.g('size','160px')}">${arr.map(card).join('')}</div>`:`<div class="empty">Burada henüz oyun yok. Bir oyunda ♡'ye bas!</div>`);
  Q('#sort').value=so;Q('#size').value=LS.g('size','160px');
  Q('#sort').onchange=e=>{LS.s('sort',e.target.value);render()};Q('#size').onchange=e=>{LS.s('size',e.target.value);render()}}
function toast(t){const e=Q('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[id,...favs];LS.s('favs',favs);toast(favs.includes(id)?'❤️ Favorilere eklendi':'Favorilerden çıkarıldı');renderNav();if(Q('#player').classList.contains('on'))updP();else render()}
let curG=null;
function play(id){const g=byId[id];if(!g)return;curG=g;stopMusic();
  recent=[id,...recent.filter(x=>x!==id)].slice(0,20);LS.s('recent',recent);plays[id]=(plays[id]||0)+1;LS.s('plays',plays);
  Q('#frame').src=g.u;Q('#ptitle').textContent=g.t;Q('#player').classList.add('on');document.body.style.overflow='hidden';
  history.replaceState(null,'','#oyna='+id);
  Q('#side').innerHTML='<b>Benzer oyunlar</b>'+shuffle(GAMES.filter(x=>x.c===g.c&&x.id!==id)).slice(0,12).map(card).join('');updP()}
function updP(){if(!curG)return;const s=stats[curG.id]||{};Q('#lc').textContent=s.likes||0;Q('#dc').textContent=s.dislikes||0;
  Q('#likeBtn').classList.toggle('on',myVote[curG.id]===1);Q('#disBtn').classList.toggle('on',myVote[curG.id]===-1);Q('#pfav').textContent=favs.includes(curG.id)?'♥':'♡'}
function closeP(){Q('#player').classList.remove('on');Q('#frame').src='about:blank';document.body.style.overflow='';history.replaceState(null,'',location.pathname);curG=null;render()}
function playRandom(){play(GAMES[Math.floor(Math.random()*GAMES.length)].id)}
async function vote(v){if(!curG)return;const id=curG.id,old=myVote[id]||0,nw=old===v?0:v;
  const dl=(nw===1)-(old===1),dd=(nw===-1)-(old===-1);myVote[id]=nw;LS.s('votes',myVote);
  const s=stats[id]=stats[id]||{likes:0,dislikes:0};s.likes=Math.max(0,s.likes+dl);s.dislikes=Math.max(0,s.dislikes+dd);updP();
  if(sb)try{await sb.rpc('vote_game',{p_game_id:id,p_like_delta:dl,p_dislike_delta:dd})}catch(e){}}
async function loadStats(){if(!sb)return;try{const{data}=await sb.from('game_stats').select('game_id,likes,dislikes');(data||[]).forEach(r=>stats[r.game_id]=r);if(!curG)render();updP();
  sb.channel('sgp').on('postgres_changes',{event:'*',schema:'public',table:'game_stats'},p=>{if(p.new){stats[p.new.game_id]=p.new;updP()}}).subscribe()}catch(e){}}
/* müzik */
let ac,mus=null,musOn=LS.g('mus',true);
function startMusic(){if(!musOn||mus)return;ac=ac||new AudioContext();const notes=[262,330,392,523,392,330,294,349,440,349];let i=0;const g=ac.createGain();g.gain.value=.05;g.connect(ac.destination);
  mus=setInterval(()=>{const o=ac.createOscillator();o.type='triangle';o.frequency.value=notes[i++%notes.length];const e=ac.createGain();e.gain.setValueAtTime(1,ac.currentTime);e.gain.exponentialRampToValueAtTime(.01,ac.currentTime+.3);o.connect(e).connect(g);o.start();o.stop(ac.currentTime+.3)},280)}
function stopMusic(){clearInterval(mus);mus=null}
/* olaylar */
document.addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){e.stopPropagation();return toggleFav(f.dataset.fav)}
  const c=e.target.closest('[data-cat]');if(c)return goCat(c.dataset.cat);const g=e.target.closest('.g');if(g)play(g.dataset.id)});
Q('#startBtn').onclick=()=>{Q('#gate').remove();startMusic();const h=location.hash.match(/oyna=(.+)/);if(h)play(decodeURIComponent(h[1]))};

const AI_API=(/lovable\.app$|localhost/.test(location.hostname)?'':'https://code-snippet-zipper.lovable.app')+'/api/public/recommend';
let aiRes=null;
function aiHTML(){return `<div id="aiBox"><h2>🤖 Sigma AI – Ne oynamak istersin?</h2><div id="aiRow"><input id="aiQ" placeholder="Örn: arkadaşımla oynayabileceğim hızlı araba oyunu" maxlength="300"><button id="aiGo">Öner ✨</button></div><div id="aiMsg">${aiRes?aiRes.message:''}</div>${aiRes&&aiRes.ids.length?`<div class="row">${aiRes.ids.map(i=>byId[i]).filter(Boolean).map(card).join('')}</div>`:''}</div>`}
async function aiAsk(){const q=Q('#aiQ').value.trim();if(!q)return;Q('#aiGo').disabled=true;Q('#aiMsg').textContent='🤔 Düşünüyorum...';
  try{const r=await fetch(AI_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,catalog:GAMES.map(g=>g.id+'|'+g.t+'|'+g.c).join('\n')})});const d=await r.json();
    if(!r.ok)throw 0;aiRes={message:d.message||'İşte sana önerilerim:',ids:d.ids||[]};if(!aiRes.ids.length)aiRes.message='Uygun oyun bulamadım, başka türlü anlatır mısın?';render();setTimeout(()=>{Q('#aiQ').value=q},0)}
  catch(e){Q('#aiMsg').textContent='😢 Şu an öneri alınamadı, biraz sonra tekrar dene.';Q('#aiGo').disabled=false}}
document.addEventListener('click',e=>{if(e.target.id==='aiGo')aiAsk()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aiQ')aiAsk()});
Q('#q').oninput=render;
Q('#rndBtn').onclick=playRandom;
Q('#menuBtn').onclick=()=>Q('#nav').classList.toggle('open');
Q('#musBtn').onclick=()=>{musOn=!musOn;LS.s('mus',musOn);musOn?startMusic():stopMusic();toast(musOn?'🎵 Müzik açık':'🔇 Müzik kapalı')};
Q('#thmBtn').onclick=()=>{document.body.classList.toggle('light');LS.s('light',document.body.classList.contains('light'))};
if(LS.g('light',false))document.body.classList.add('light');
Q('#backBtn').onclick=closeP;Q('#likeBtn').onclick=()=>vote(1);Q('#disBtn').onclick=()=>vote(-1);Q('#pfav').onclick=()=>toggleFav(curG.id);
Q('#reBtn').onclick=()=>{Q('#frame').src=curG.u};
Q('#fsBtn').onclick=()=>{const f=Q('#frame');(f.requestFullscreen||f.webkitRequestFullscreen).call(f)};
Q('#shareBtn').onclick=()=>{navigator.clipboard?.writeText(location.href);toast('🔗 Link kopyalandı!')};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==Q('#q')&&!curG){e.preventDefault();Q('#q').focus()}if(e.key==='Escape'&&curG&&!document.fullscreenElement)closeP()});
renderNav();render();loadStats();
</script>
</body>
</html>
